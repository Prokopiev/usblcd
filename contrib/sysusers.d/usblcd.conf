# Dedicated account for the USB LCD panel service.
#
# systemd creates the group with the same name as the user, and the udev rule
# grants that group read/write on the panel's device node — so the service
# needs no supplementary groups at all, and humans who drive the panel by hand
# are simply added to it:
#
#   sudo systemd-sysusers /usr/lib/sysusers.d/usblcd.conf
#   sudo usermod -aG usblcd you
#
# No HOME is set on purpose: the dashboard writes nothing.  The measured panel
# calibration comes from /etc/usblcd/calibration via USBLCD_CALIB in the unit.
u usblcd - "usblcd USB LCD panel service" /usr/bin/nologin
